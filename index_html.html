<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة المراجعة النهائية – الرياضيات المتكاملة – الصف العاشر عام</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0b2a5b;--red:#c8102e;--green:#1e7b4f;--gold:#b8860b;--ink:#1f2a44}
  html,body{font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:#f4f1ea}
  body{margin:0}
  .hero{background:radial-gradient(circle at 15% 20%,rgba(200,16,46,.35),transparent 40%),radial-gradient(circle at 85% 80%,rgba(30,123,79,.4),transparent 45%),linear-gradient(135deg,#071b3d,#0b2a5b 55%,#123f7a)}
  .pattern{background-image:linear-gradient(30deg,rgba(255,255,255,.05) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.05) 87.5%),linear-gradient(150deg,rgba(255,255,255,.05) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.05) 87.5%);background-size:48px 84px}
  /* math */
  .m{font-family:'Cambria Math','Times New Roman',serif;font-size:1.1em;white-space:nowrap;unicode-bidi:isolate}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 3px}
  .frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
  .frac>span:last-child{padding:0 4px}
  .frac.fs{font-size:.8em;margin:0 1px}
  .rad{white-space:nowrap}.rb{border-top:1.5px solid currentColor;padding:0 2px;margin-right:1px}
  sup{font-size:.72em;vertical-align:super;line-height:0}
  /* options */
  .opt{transition:all .15s;cursor:pointer}
  .opt:hover:not(.locked){transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .opt.ok{background:#dcfce7!important;border-color:#16a34a!important}
  .opt.bad{background:#fee2e2!important;border-color:#dc2626!important}
  .opt.locked{cursor:default}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
  .bar{transition:width .4s ease}
  .imgslot{border:2px dashed #94a3b8;border-radius:14px;background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 10px,#f1f5f9 10px,#f1f5f9 20px)}
  table.dash{border-collapse:collapse;width:100%;font-size:.85rem}
  table.dash th,table.dash td{border:1px solid #cbd5e1;padding:.35rem .45rem;text-align:center;white-space:nowrap}
  table.dash th{background:#0b2a5b;color:#fff;position:sticky;top:0}
  @media print{
    .no-print{display:none!important}
    body{background:#fff}
    .printwrap{overflow:visible!important}
    table.dash{font-size:.62rem}
    table.dash th{position:static;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .pc{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4"></div>

<script>
/* =====================================================================
   منصة المراجعة النهائية التفاعلية – الرياضيات المتكاملة – الصف العاشر عام
   مجمع زايد التعليمي بالرقايب  |  الأستاذ/ أسامة البادي
   ---------------------------------------------------------------------
   * كل البيانات تُحفظ في LocalStorage داخل متصفح الجهاز نفسه.
   * بنك الأسئلة في المصفوفة LESSONS أدناه، ويمكن تعديله أو إضافة أسئلة
     من لوحة المعلم (استيراد JSON) دون لمس الكود.
   * كتابة الرياضيات داخل النصوص:  $ ... $  لتمييز المقدار الرياضي
        x^{2} أو x^2  = أس      {a|b} = كسر      √{x} أو √3 = جذر
        ^(1|2) = أس كسري        * = ×           -  = −
   ===================================================================== */

const TEACHER = 'الأستاذ/ أسامة البادي';
const SCHOOL  = 'مجمع زايد التعليمي بالرقايب';
const DEPUTY  = 'فاطمة البلوشي';
const PASS    = '0099';
const KEY     = 'zayed_math_review_v1';

/* ---------- مولّدات الأسئلة ---------- */
const mc=(text,right,wrong,explain,ctx)=>({type:'mcq',text,options:[right,...wrong],answer:0,explain,ctx});
const tf=(text,ans,explain)=>({type:'tf',text,answer:ans,explain});
const mt=(text,pairs,explain)=>({type:'match',text,pairs,explain});

/* ---------- بنك الأسئلة حسب دروس الهيكل الوزاري ---------- */
const LESSONS=[
 {id:1,unit:1,code:'C1L1',emoji:'➕',title:'جمع وطرح كثيرات الحدود',sci:'الاقتصاد: الربح = الإيراد − التكلفة',q:[
  mc('أوجد ناتج $(3x^{2}+5x-2)+(x^{2}-2x+7)$ :','4x^{2}+3x+5',['4x^{2}+7x+5','3x^{2}+3x+5','4x^{2}+3x-9'],'نجمع الحدود المتشابهة: $3+1=4$ ، $5-2=3$ ، $-2+7=5$.'),
  mc('أوجد ناتج $(5x^{2}-3x+4)-(2x^{2}+x-6)$ :','3x^{2}-4x+10',['3x^{2}-2x-2','3x^{2}-4x-2','7x^{2}-2x-2'],'عند الطرح نغيّر إشارة كل حد في الكثيرة الثانية: $-3x-x=-4x$ و $4+6=10$.'),
  mc('الصيغة القياسية للكثيرة $7+3x-2x^{3}+x^{2}$ هي:','-2x^{3}+x^{2}+3x+7',['7+3x+x^{2}-2x^{3}','-2x^{3}+3x+x^{2}+7','7-2x^{3}+3x+x^{2}'],'الصيغة القياسية: ترتيب الحدود تنازلياً حسب الأس، فالحد الأعلى درجة أولاً.'),
  tf('درجة كثيرة الحدود $4x^{5}-2x^{2}+9$ تساوي $5$ .',true,'درجة الكثيرة هي أكبر أس للمتغير، وهو $5$ هنا.'),
  mc('إيراد متجر $R=5x^{2}+20x$ وتكلفته $C=2x^{2}+8x+100$ (بالدرهم). الربح $P=R-C$ يساوي:','3x^{2}+12x-100',['3x^{2}+12x+100','7x^{2}+28x+100','3x^{2}+28x-100'],'$P=(5-2)x^{2}+(20-8)x-100=3x^{2}+12x-100$.',['🏪','اقتصاد']),
 ]},
 {id:2,unit:1,code:'C1L3',emoji:'✖️',title:'ضرب كثيرات الحدود',sci:'الهندسة: مساحة المستطيل = الطول × العرض',q:[
  mc('أوجد ناتج $(x+3)(x+7)$ :','x^{2}+10x+21',['x^{2}+21x+10','x^{2}+10x+10','x^{2}+4x+21'],'FOIL: $x^{2}+7x+3x+21=x^{2}+10x+21$.'),
  mc('أوجد ناتج $(2x-1)(x+4)$ :','2x^{2}+7x-4',['2x^{2}+9x-4','2x^{2}-7x-4','2x^{2}+7x+4'],'$2x^{2}+8x-x-4=2x^{2}+7x-4$.'),
  mc('أوجد ناتج $(x^{2}-3x+1)(x+2)$ :','x^{3}-x^{2}-5x+2',['x^{3}-5x^{2}-5x+2','x^{3}-x^{2}-6x+2','x^{3}+x^{2}-5x+2'],'نوزّع: $x^{3}+2x^{2}-3x^{2}-6x+x+2=x^{3}-x^{2}-5x+2$.'),
  tf('$(x-5)(x+5)=x^{2}-10x-25$',false,'الحدان الأوسطان يلغيان بعضهما: $(x-5)(x+5)=x^{2}-25$.'),
  mc('مستطيل طوله $(x+5)$ وعرضه $(x+2)$ . مساحته تساوي:','x^{2}+7x+10',['x^{2}+10x+7','2x+14','x^{2}+7x+7'],'المساحة $=(x+5)(x+2)=x^{2}+2x+5x+10=x^{2}+7x+10$.',['📐','هندسة']),
 ]},
 {id:3,unit:1,code:'C1L4',emoji:'🔷',title:'نواتج الضرب الخاصة',sci:'التصميم: مساحة ساحة مربعة الشكل',q:[
  mc('أوجد ناتج $(x+5)^{2}$ :','x^{2}+10x+25',['x^{2}+25','x^{2}+5x+25','x^{2}+10x+10'],'$(a+b)^{2}=a^{2}+2ab+b^{2}$ ⇒ $x^{2}+10x+25$.'),
  mc('أوجد ناتج $(3x-2)^{2}$ :','9x^{2}-12x+4',['9x^{2}+4','9x^{2}-6x+4','3x^{2}-12x+4'],'$(3x)^{2}-2(3x)(2)+2^{2}=9x^{2}-12x+4$.'),
  mc('أوجد ناتج ضرب المجموع في الفرق $(x+6)(x-6)$ :','x^{2}-36',['x^{2}+36','x^{2}-12x+36','x^{2}-12'],'$(a+b)(a-b)=a^{2}-b^{2}$ ⇒ $x^{2}-36$.'),
  tf('$(a+b)^{2}=a^{2}+b^{2}$ لكل عددين $a$ و $b$ .',false,'الصحيح $(a+b)^{2}=a^{2}+2ab+b^{2}$. مثال: $a=1$ و $b=2$ ⇒ $9\\neq5$.'),
  mc('حديقة مربعة طول ضلعها $(x+4)$ متراً. مساحتها تساوي:','x^{2}+8x+16',['x^{2}+16','x^{2}+4x+16','4x+16'],'المساحة $=(x+4)^{2}=x^{2}+8x+16$.',['🌳','تصميم حدائق']),
  mt('صِل كل مقدار بناتجه:',[['(x+4)^{2}','x^{2}+8x+16'],['(x-4)^{2}','x^{2}-8x+16'],['(x+4)(x-4)','x^{2}-16']],'مربع المجموع يعطي $+2ab$ ، ومربع الفرق يعطي $-2ab$ ، والمجموع في الفرق يعطي فرق مربعين.'),
 ]},
 {id:4,unit:1,code:'C1L5',emoji:'🧩',title:'التحليل بخاصية التوزيع (العامل المشترك)',sci:'الفيزياء: تبسيط القوانين بإخراج عامل مشترك',q:[
  mc('حلّل $5x^{2}+15x$ :','5x(x+3)',['5(x^{2}+3x)','x(5x+15)','5x(x+15)'],'العامل المشترك الأكبر هو $5x$ ، ونقسم كل حد عليه.'),
  mc('حلّل تحليلاً كاملاً $12a^{2}b-18ab^{2}$ :','6ab(2a-3b)',['6ab(2a+3b)','6ab(2b-3a)','12ab(a-b)'],'العامل المشترك الأكبر $6ab$ ، والباقي $2a-3b$.'),
  tf('$4x+8=4(x+2)$',true,'العامل المشترك $4$ ؛ و $4(x+2)=4x+8$ ✓.'),
  mc('حلّل بالتجميع $x^{3}+3x^{2}+2x+6$ :','(x+3)(x^{2}+2)',['(x+2)(x^{2}+3)','(x-3)(x^{2}+2)','(x+3)(x^{2}-2)'],'$x^{2}(x+3)+2(x+3)=(x+3)(x^{2}+2)$.'),
  mc('حلّ المعادلة $3x^{2}-12x=0$ :','$x=0$ أو $x=4$',['$x=4$ فقط','$x=0$ أو $x=-4$','$x=0$ فقط'],'$3x(x-4)=0$ ⇒ $x=0$ أو $x=4$ (خاصية الضرب الصفري).'),
 ]},
 {id:5,unit:1,code:'C1L6',emoji:'📘',title:'تحليل x² + bx + c وحل المعادلة',sci:'الهندسة: إيجاد أبعاد مستطيل من مساحته',q:[
  mc('حلّل $x^{2}+9x+20$ :','(x+4)(x+5)',['(x+2)(x+10)','(x+1)(x+20)','(x-4)(x-5)'],'نبحث عن عددين حاصل ضربهما $20$ ومجموعهما $9$ : $4$ و $5$.'),
  mc('حلّل $x^{2}-7x+12$ :','(x-3)(x-4)',['(x+3)(x+4)','(x-2)(x-6)','(x-1)(x-12)'],'عددان حاصل ضربهما $12$ ومجموعهما $-7$ : $-3$ و $-4$.'),
  mc('حلّل $x^{2}+2x-15$ :','(x+5)(x-3)',['(x-5)(x+3)','(x+5)(x+3)','(x-15)(x+1)'],'$c$ سالب فالعددان مختلفا الإشارة: حاصل ضربهما $-15$ ومجموعهما $2$ ⇒ $5$ و $-3$.'),
  mc('حلّ المعادلة $x^{2}-5x+6=0$ :','$x=2$ أو $x=3$',['$x=-2$ أو $x=-3$','$x=1$ أو $x=6$','$x=-1$ أو $x=-6$'],'$(x-2)(x-3)=0$ ⇒ $x=2$ أو $x=3$.'),
  mc('مستطيل طوله يزيد $3$ م على عرضه ومساحته $40$ م². عرضه يساوي:','$5$ م',['$8$ م','$10$ م','$3$ م'],'$w(w+3)=40$ ⇒ $w^{2}+3w-40=0$ ⇒ $(w+8)(w-5)=0$ ⇒ $w=5$ (نرفض $-8$).',['📐','هندسة']),
 ]},
 {id:6,unit:1,code:'C1L7',emoji:'⚽',title:'تحليل ax² + bx + c وحل المعادلة',sci:'الفيزياء والتربية الرياضية: مسار الكرة',q:[
  mc('حلّل $2x^{2}+7x+3$ :','(2x+1)(x+3)',['(2x+3)(x+1)','(2x+1)(2x+3)','(x+3)(x+1)'],'$ac=6$ ؛ العددان $1$ و $6$ : $2x^{2}+x+6x+3=x(2x+1)+3(2x+1)$.'),
  mc('حلّل $3x^{2}-10x+8$ :','(3x-4)(x-2)',['(3x+4)(x+2)','(3x-2)(x-4)','(3x-8)(x-1)'],'$ac=24$ ؛ العددان $-4$ و $-6$ : $3x^{2}-4x-6x+8=(3x-4)(x-2)$.'),
  mc('حلّ المعادلة $2x^{2}+5x-3=0$ :','$x={1|2}$ أو $x=-3$',['$x=-{1|2}$ أو $x=3$','$x={1|2}$ أو $x=3$','$x=-1$ أو $x={3|2}$'],'$(2x-1)(x+3)=0$ ⇒ $x={1|2}$ أو $x=-3$.'),
  tf('ثلاثية الحدود $2x^{2}+3x+4$ أولية (لا تقبل التحليل بأعداد صحيحة).',true,'$ac=8$ ولا يوجد عددان حاصل ضربهما $8$ ومجموعهما $3$.'),
  mc('تُقذف كرة فيعطي ارتفاعها $h=-16t^{2}+24t+16$ (قدم). متى تصل الأرض ($h=0$) ؟','$2$ ثانية',['$3$ ثوانٍ','$1.5$ ثانية','$4$ ثوانٍ'],'نقسم على $-8$ : $2t^{2}-3t-2=0$ ⇒ $(2t+1)(t-2)=0$ ⇒ $t=2$ (نرفض الزمن السالب).',['⚽','فيزياء ورياضة']),
 ]},
 {id:7,unit:1,code:'C1L8',emoji:'🟦',title:'الفرق بين مربعين',sci:'التصميم: مساحة إطار الصورة',q:[
  mc('حلّل $x^{2}-49$ :','(x+7)(x-7)',['(x-7)^{2}','(x+7)^{2}','(x-49)(x+1)'],'$a^{2}-b^{2}=(a+b)(a-b)$ ؛ $49=7^{2}$.'),
  mc('حلّل $4x^{2}-25$ :','(2x+5)(2x-5)',['(4x+5)(4x-5)','(2x-5)^{2}','(2x+5)^{2}'],'$4x^{2}=(2x)^{2}$ و $25=5^{2}$.'),
  mc('حلّل تحليلاً كاملاً $3x^{2}-75$ :','3(x+5)(x-5)',['(3x+5)(3x-5)','3(x-5)^{2}','3(x^{2}+25)'],'نخرج العامل $3$ : $3(x^{2}-25)=3(x+5)(x-5)$.'),
  tf('$x^{2}+16=(x+4)^{2}$',false,'$(x+4)^{2}=x^{2}+8x+16$ ؛ ومجموع مربعين لا يُحلَّل في الأعداد الحقيقية.'),
  mc('حلّ المعادلة $9x^{2}-16=0$ :','$x=\\pm{4|3}$',['$x=\\pm{16|9}$','$x=\\pm{3|4}$','$x=\\pm4$'],'$(3x+4)(3x-4)=0$ ⇒ $x=\\pm{4|3}$.'),
  mt('صِل كل مقدار بتحليله:',[['x^{2}-9','(x+3)(x-3)'],['4x^{2}-1','(2x+1)(2x-1)'],['25-x^{2}','(5+x)(5-x)']],'نكتب كل حد على صورة مربع ثم نطبّق $(a+b)(a-b)$.'),
 ]},
 {id:8,unit:1,code:'C1L9',emoji:'🔶',title:'المربعات الكاملة',sci:'الفيزياء: السقوط الحر h = −16t² + h₀',q:[
  mc('حلّل $x^{2}+10x+25$ :','(x+5)^{2}',['(x+5)(x-5)','(x-5)^{2}','(x+25)(x+1)'],'$x^{2}+2(x)(5)+5^{2}=(x+5)^{2}$.'),
  mc('حلّل $9y^{2}-12y+4$ :','(3y-2)^{2}',['(3y+2)^{2}','(9y-2)(y-2)','(3y-4)^{2}'],'$(3y)^{2}-2(3y)(2)+2^{2}=(3y-2)^{2}$.'),
  mc('أيّ ثلاثيات الحدود الآتية مربع كامل؟','x^{2}+6x+9',['x^{2}+6x+6','x^{2}+4x+9','x^{2}+9x+6'],'الحد الأوسط يجب أن يساوي $2\\times$ جذر الأول $\\times$ جذر الأخير: $2(x)(3)=6x$ ✓.'),
  mc('حلّ المعادلة $x^{2}+8x+16=0$ :','$x=-4$',['$x=4$','$x=\\pm4$','$x=8$'],'$(x+4)^{2}=0$ ⇒ $x=-4$ (جذر مكرر).'),
  mc('يسقط جسم من ارتفاع $64$ قدماً، ويعطي ارتفاعه $h=-16t^{2}+64$ . يصل إلى الأرض بعد:','$2$ ثانية',['$4$ ثوانٍ','$16$ ثانية','$1$ ثانية'],'$-16t^{2}+64=0$ ⇒ $t^{2}=4$ ⇒ $t=2$ (نرفض $-2$).',['🏗️','فيزياء']),
 ]},
 {id:9,unit:2,code:'C2L1',emoji:'🔢',title:'خواص ضرب الأسس',sci:'الفيزياء: E = mc²',q:[
  mc('بسّط $x^{3}\\times x^{4}$ :','x^{7}',['x^{12}','x^{1}','2x^{7}'],'عند الضرب نجمع الأسس: $3+4=7$.'),
  mc('بسّط $(2x^{3})(5x^{2})$ :','10x^{5}',['10x^{6}','7x^{5}','25x^{5}'],'نضرب المعاملات $2\\times5=10$ ونجمع الأسس $3+2=5$.'),
  mc('بسّط $(x^{2})^{3}$ :','x^{6}',['x^{5}','x^{8}','x^{9}'],'عند رفع قوة لقوة نضرب الأسس: $2\\times3=6$.'),
  mc('بسّط $(3a^{2}b)^{2}$ :','9a^{4}b^{2}',['3a^{4}b^{2}','9a^{2}b^{2}','6a^{4}b^{2}'],'نرفع كل عامل للقوة $2$ بما فيها المعامل: $3^{2}=9$.'),
  tf('$(2x)^{3}=2x^{3}$',false,'$(2x)^{3}=2^{3}x^{3}=8x^{3}$.'),
  mt('صِل كل تعبير بناتجه:',[['x^{2}*x^{3}','x^{5}'],['(x^{2})^{3}','x^{6}'],['(2x)^{2}','4x^{2}']],'الضرب: نجمع الأسس. رفع قوة لقوة: نضرب الأسس. قوة لناتج ضرب: نوزّع الأس.'),
 ]},
 {id:10,unit:2,code:'C2L2',emoji:'➗',title:'خواص قسمة الأسس',sci:'التقنية: مقارنة سعات التخزين 2³⁰ ÷ 2²⁰',q:[
  mc('بسّط ${x^9|x^3}$ :','x^{6}',['x^{3}','x^{12}','x^{27}'],'عند القسمة نطرح الأسس: $9-3=6$.'),
  mc('بسّط ${12a^5b^2|4a^2b}$ :','3a^{3}b',['8a^{3}b','3a^{7}b^{3}','3a^{3}'],'$12\\div4=3$ ؛ $a^{5-2}=a^{3}$ ؛ $b^{2-1}=b$.'),
  mc('بسّط $({2x|3})^{2}$ :','{4x^2|9}',['{4x^2|3}','{2x^2|9}','{4x|9}'],'نرفع البسط والمقام للقوة $2$ : ${(2x)^2|3^2}={4x^2|9}$.'),
  mc('قيمة $2^{-3}$ تساوي:','{1|8}',['-8','{1|6}','-6'],'الأس السالب: $a^{-n}={1|a^n}$ ⇒ $2^{-3}={1|2^3}={1|8}$.'),
  tf('$x^{0}=0$ لكل $x\\neq0$ .',false,'الأس الصفري: $x^{0}=1$ لأي $x\\neq0$.'),

/* ======================= أدوات مساعدة ======================= */
const AR=/[\u0600-\u06FF]/;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function mathHTML(m){
  m=esc(m);
  m=m.replace(/\\sqrt\[(\d+)\]\{([^{}]+)\}/g,'<span class="rad"><sup>$1</sup>√<span class="rb">$2</span></span>');
  m=m.replace(/\\sqrt\{([^{}]+)\}/g,'√{$1}').replace(/\\sqrt(\d+)/g,'√$1');
  m=m.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'{$1|$2}').replace(/\\frac12/g,'{1|2}');
  m=m.replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\pm/g,'±').replace(/\\neq/g,'≠').replace(/\{,\}/g,',');
  m=m.replace(/-/g,'−').replace(/\*/g,'×');
  m=m.replace(/√\{([^{}]+)\}/g,'<span class="rad">√<span class="rb">$1</span></span>');
  m=m.replace(/√(\d+|[a-zA-Z])/g,'<span class="rad">√<span class="rb">$1</span></span>');
  m=m.replace(/\^\((\d+)\|(\d+)\)/g,'<sup><span class="frac fs"><span>$1</span><span>$2</span></span></sup>');
  m=m.replace(/\{([^{}|]+)\|([^{}|]+)\}/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
  m=m.replace(/\^\{([^{}]+)\}/g,'<sup>$1</sup>').replace(/\^(−?\d+|[a-zA-Z])/g,'<sup>$1</sup>');
  return '<bdi dir="ltr" class="m">'+m+'</bdi>';
}
function fmt(s){
  return String(s).split(/(\$[^$]+\$)/).map(p=>(p.length>2&&p[0]==='$'&&p[p.length-1]==='$')?mathHTML(p.slice(1,-1)):esc(p)).join('');
}
function fmtOpt(s){ return (AR.test(s)||s.includes('$'))?fmt(s):mathHTML(s); }
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=(s,r=document)=>r.querySelector(s);
const fmtDate=t=>t?new Date(t).toLocaleString('ar-AE',{dateStyle:'short',timeStyle:'short'}):'—';

}

function prep(q){
  const p={...q};
  if(q.type==='mcq'){const idx=shuffle(q.options.map((_,i)=>i));p.order=idx;p.correctPos=idx.indexOf(q.answer);}
  if(q.type==='match'){p.rightOrder=shuffle(q.pairs.map((_,i)=>i));}
  return p;
}
function startLesson(id){
  const l=LESSONS.find(x=>x.id===id);
  S.lesson=l;S.qs=shuffle(lessonQuestions(l)).map(prep);S.qi=0;S.res=[];S.locked=false;S.view='quiz';render();window.scrollTo(0,0);
}

function feedback(ok,q,extra){

function checkMatch(){

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportCSV(){
  const rows=[['الطالب','الشعبة',...LESSONS.map(l=>'د'+l.id+' '+l.title),'المعدل %','الدروس المنجزة','آخر نشاط']];
  studentList().forEach(r=>rows.push([r.name,r.section,...LESSONS.map(l=>r.lessons[l.id]?r.lessons[l.id].best:''),avgOf(r)===null?'':avgOf(r),LESSONS.filter(l=>r.lessons[l.id]).length,fmtDate(r.updated)]));
  download('نتائج_مراجعة_الرياضيات.csv','\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8');
}
function mergeInto(data){
  let n=0;
  Object.entries(data.students||{}).forEach(([id,r])=>{
    const cur=DB.students[id]||(DB.students[id]={name:r.name,section:r.section,lessons:{},updated:0});
    Object.entries(r.lessons||{}).forEach(([lid,x])=>{
      const o=cur.lessons[lid];
      if(!o)cur.lessons[lid]=x;else cur.lessons[lid]={...(x.ts>o.ts?x:o),best:Math.max(o.best,x.best),attempts:o.attempts+x.attempts};
    });
    cur.updated=Math.max(cur.updated||0,r.updated||0);n++;
  });
  saveDB();return n;
}

function render(){

  $('#app').innerHTML=v==='landing'?landing():v==='home'?home():v==='quiz'?quiz():v==='result'?result():dash();
  if(v==='dash'){
    const fq=$('#fq'),fs=$('#fsec');
    if(fq)fq.addEventListener('input',e=>{S.fq=e.target.value.trim();$('#tbl').innerHTML=tableHTML();});
    if(fs)fs.addEventListener('change',e=>{S.fsec=e.target.value;$('#tbl').innerHTML=tableHTML();});
    const imp=$('#impfile');
    if(imp)imp.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const n=mergeInto(JSON.parse(rd.result));toast('✅ تم استيراد نتائج '+n+' طالب');render();}catch(err){toast('⚠️ الملف غير صالح');}};rd.readAsText(f);});
  }
  if(v==='landing'){['sname','ssec'].forEach(id=>{const e=$('#'+id);if(e)e.addEventListener('keydown',ev=>{if(ev.key==='Enter')startStudent();});});}

function startStudent(){

  const id=sid(n,s);
  if(!DB.students[id])DB.students[id]={name:n,section:s,lessons:{},updated:Date.now()};
  saveDB();S.student={id,name:DB.students[id].name,section:DB.students[id].section};S.view='home';render();window.scrollTo(0,0);
}

    case 'exportme':{const r=DB.students[S.student.id];download('نتيجتي_'+S.student.name.replace(/\s+/g,'_')+'.json',JSON.stringify({students:{[S.student.id]:r}},null,1),'application/json');break;}
    case 'expjson':download('نتائج_الطلاب_كاملة.json',JSON.stringify({students:DB.students},null,1),'application/json');break;
    case 'reset':if(confirm('هل أنت متأكد من تصفير جميع نتائج الطلاب؟ لا يمكن التراجع عن هذا الإجراء.')){DB.students={};saveDB();toast('تم تصفير النتائج');render();}break;
    case 'delstu':if(confirm('حذف نتائج هذا الطالب؟')){delete DB.students[b.dataset.id];saveDB();render();}break;
    case 'addq':{
      try{
        const arr=JSON.parse($('#newq').value);if(!Array.isArray(arr))throw 0;
        arr.forEach(q=>{if(!q.lesson||!q.text||!q.type)throw 0;});
        DB.custom.push(...arr);saveDB();toast('✅ أُضيف '+arr.length+' سؤال');render();
      }catch(err){toast('⚠️ صيغة JSON غير صحيحة، راجع المثال');}
      break;}
    case 'clearq':if(confirm('حذف جميع الأسئلة المضافة؟')){DB.custom=[];saveDB();render();}break;
  }
});
render();
</script>
</body>
</html>
